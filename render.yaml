services:
  - type: web
    name: toggl-web-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: toggl-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://toggl-web-frontend.onrender.com

  - type: web
    name: toggl-web-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        value: https://toggl-web-backend.onrender.com

databases:
  - name: toggl-db
    plan: free
